# Batch TopK SAE (dictionary_learning.trainers.batch_top_k): the k * batch largest activations over the whole batch are
# kept. Same settings as top_k.yaml apart from the two classes.
dict_class: "BatchTopKSAE"
trainer_class: "BatchTopKTrainer"
activation_dim: null   # from the datamodule (train.yaml)
dict_size: null        # activation_dim * expansion_factor

lr: 1e-4
warmup_steps: 1000
steps: null            # total_steps, set at run time
decay_start: null
auxk_alpha: 0.03125    # 1/32, as in Gao et al.
threshold_beta: 0.999
threshold_start_step: 1000

seed: 0
device: "cuda"
layer: null
lm_name: null
k: 100

wandb_name: null
submodule_name: null
