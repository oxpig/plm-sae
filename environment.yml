# Main environment: SAE training, activation extraction, generation, ANARCI numbering and every analysis.
# These are the versions of the environment that produced the paper's results (Python 3.10.19, CUDA 12.8 wheels).
#   conda env create -f environment.yml && conda activate plm-sae && pip install -e . --no-deps
# This holds the dependencies only. The base models (p-IgGen, IgLM, ProGen2), sparsify and ANARCI are installed from
# their own repositories afterwards with --no-deps, so they cannot change these versions (README.md, Getting started).
# FlashTAP and AbLang-2 run in their own environments (envs/flashtap.yml, envs/ablang2.yml).
name: plm-sae
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.19
  - numpy=2.2.6
  - scipy=1.15.2
  - scikit-learn=1.7.2
  - biopython=1.87
  - hmmer=3.3.2
  - joblib=1.5.3
  - pip
  - pip:
      - torch==2.9.1
      - transformers==4.57.3
      - tokenizers==0.22.2
      - safetensors==0.7.0
      - huggingface-hub==0.36.0
      - accelerate==1.12.0
      - datasets==4.4.2
      - pandas==2.3.3
      - pyarrow==22.0.0
      - matplotlib==3.10.9
      - seaborn==0.13.2
      - pyyaml==6.0.3
      - tqdm==4.67.1
      - einops==0.8.1
      - pytorch-lightning==2.5.6
      - lightning-utilities==0.15.3
      - litdata==0.2.59
      - hydra-core==1.3.4
      - omegaconf==2.3.1
      - python-levenshtein==0.27.3
      - click==8.4.2
      - natsort==8.4.0
      - schedulefree==1.4.1
      - simple-parsing==0.1.7
      - pytest
